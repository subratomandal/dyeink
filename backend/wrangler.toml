#:schema node_modules/wrangler/config-schema.json
#
# DyeInk — Cloudflare Worker + D1 + R2 + static Pages-style assets.
# Everything you need for a working blog lives in one Worker.
#
# Manual backend-local deploy config. The root wrangler.toml is used by the
# Deploy to Cloudflare button.
#
# To do that deploy locally instead:
#   wrangler login
#   wrangler d1 create dyeink            # once — copy the id into this file
#   wrangler r2 bucket create dyeink-images  # once
#   wrangler d1 migrations apply dyeink  # creates tables
#   wrangler secret put APP_PASSWORD     # optional, or use the setup form
#   npm run deploy

name = "dyeink"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare runs this before `wrangler deploy`. It builds the React SPA so
# the [assets] directory below has something to serve. Re-runs are idempotent.
[build]
command = "cd ../platform && npm install --legacy-peer-deps --no-audit --no-fund && npm run build"


# -------- Static frontend (platform/dist) served by the Worker --------
# After `cd platform && npm run build`, Cloudflare serves those files for any
# request that doesn't match /api/* or /img/*. This is why DyeInk is a single
# deploy: one Worker, one URL, no separate Pages project.
[assets]
directory = "../platform/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# -------- D1: relational storage --------
# No database_id is committed. Wrangler auto-provisions D1 on first deploy.
[[d1_databases]]
binding = "DB"
database_name = "dyeink"
migrations_dir = "migrations"

# -------- R2: image uploads --------
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "dyeink-images"

# -------- Worker runtime vars --------
[vars]
# Optional. Set via `wrangler secret put R2_PUBLIC_URL` instead if your R2
# bucket has a custom domain — those values shouldn't be in git.
D1_HIT_ROLLUPS = "on"
# Optional newsletter sending via Cloudflare Email Service.
# Requires Workers Paid plan, an onboarded Email Service domain, and the
# send_email binding below. Leave commented to keep free/basic deploys working.
# SITE_URL = "https://your-domain.com"
# EMAIL_FROM = "newsletter@your-domain.com"
# EMAIL_FROM_NAME = "DyeInk"

# [[send_email]]
# name = "EMAIL"
# allowed_sender_addresses = ["newsletter@your-domain.com"]

# Analytics Engine support exists in the Worker code but is intentionally not
# bound by default because accounts must enable it first. If you enable it in
# Cloudflare later, add:
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "dyeink_events"

[observability]
enabled = true
head_sampling_rate = 1
