#:schema node_modules/wrangler/config-schema.json
#
# DyeInk — Cloudflare Worker + D1 + R2 + static assets.
#
# This root config is intentionally Workers-specific because Cloudflare's
# Deploy to Cloudflare flow runs `npx wrangler deploy` from the repository
# root after `npm run build`.

name = "dyeink"
main = "backend/src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# `npm run build` creates platform/dist before Wrangler deploys this Worker.
[assets]
directory = "platform/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# -------- D1: relational storage --------
[[d1_databases]]
binding = "DB"
database_name = "dyeink"
database_id = "__REPLACE_ON_FIRST_DEPLOY__"
migrations_dir = "backend/migrations"

# -------- R2: image uploads --------
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "dyeink-images"

[observability]
enabled = true
head_sampling_rate = 1
