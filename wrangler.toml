#:schema node_modules/wrangler/config-schema.json
#
# DyeInk — Cloudflare Worker + D1 + R2 + static assets.
#
# This root config is intentionally Workers-specific because Cloudflare's
# Deploy to Cloudflare flow runs `npx wrangler deploy` from the repository
# root after `npm run build`.

name = "dyeink"
main = "backend/src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# `npm run build` creates platform/dist before Wrangler deploys this Worker.
[assets]
directory = "platform/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# -------- D1: relational storage --------
[[d1_databases]]
binding = "DB"
database_name = "dyeink"
migrations_dir = "backend/migrations"

# -------- R2: image uploads --------
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "dyeink-images"

[vars]
# Keep D1 aggregate counters on by default so the existing admin Stats
# dashboard stays populated. Set to "off" after moving stats reads fully to
# an analytics backend if you want zero D1 writes from public view/share events.
D1_HIT_ROLLUPS = "on"
# Optional newsletter sending via Cloudflare Email Service.
# Requires Workers Paid plan, an onboarded Email Service domain, and the
# send_email binding below. Leave commented to keep free/basic deploys working.
# SITE_URL = "https://your-domain.com"
# EMAIL_FROM = "newsletter@your-domain.com"
# EMAIL_FROM_NAME = "DyeInk"

# Optional one-click custom domain connection from Settings.
# Add CLOUDFLARE_API_TOKEN as a secret with Workers Scripts Write permission.
# Zone DNS Edit is optional, but lets DyeInk repair NXDOMAIN automatically if
# Cloudflare accepts the custom domain before DNS is visible.
# Add CLOUDFLARE_ACCOUNT_ID as a runtime variable/secret. If the token cannot
# list zones, also add CLOUDFLARE_ZONE_ID and CLOUDFLARE_ZONE_NAME.
# CLOUDFLARE_WORKER_NAME defaults to "dyeink".

# [[send_email]]
# name = "EMAIL"
# allowed_sender_addresses = ["newsletter@your-domain.com"]

# Analytics Engine support exists in the Worker code but is intentionally not
# bound by default because accounts must enable it first. If you enable it in
# Cloudflare later, add:
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "dyeink_events"

[observability]
enabled = true
head_sampling_rate = 1
