<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DyeInk - A modern, free blog platform with custom domain support" />
  <title>DyeInk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@300;400;500;700;900&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      var hostname = window.location.hostname.toLowerCase().replace(/\.$/, '');
      var isDefaultHost =
        hostname === 'localhost' ||
        hostname === '127.0.0.1' ||
        hostname === '0.0.0.0' ||
        hostname.endsWith('.workers.dev') ||
        hostname.endsWith('.pages.dev');
      var isBlogPath = window.location.pathname === '/blog' || window.location.pathname.indexOf('/blog/') === 0;

      if (!isDefaultHost && !isBlogPath) {
        window.location.replace('/blog');
        return;
      }

      window.addEventListener(
        'error',
        function (event) {
          var target = event.target;
          var tagName = target && target.tagName;
          var isBuildAsset =
            (tagName === 'SCRIPT' && target.src && target.src.indexOf('/assets/') !== -1) ||
            (tagName === 'LINK' && target.href && target.href.indexOf('/assets/') !== -1);
          if (!isBuildAsset) return;

          try {
            var key = 'dyeink_asset_reload_once';
            if (window.sessionStorage.getItem(key)) return;
            window.sessionStorage.setItem(key, '1');
          } catch {
            /* sessionStorage can be unavailable in hardened browsers */
          }
          window.location.reload();
        },
        true
      );

      window.addEventListener('load', function () {
        try {
          window.sessionStorage.removeItem('dyeink_asset_reload_once');
        } catch {
          /* sessionStorage can be unavailable in hardened browsers */
        }
      });
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
